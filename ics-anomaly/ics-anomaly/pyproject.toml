[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icsguard"
version = "0.1.0"
description = "Budget-calibrated, regime-aware attack detection for ICS/PLC telemetry"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "fastapi", "uvicorn", "pydantic"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "matplotlib"]
deep = ["torch"]

[project.scripts]
icsguard = "icsguard.cli:main"

[tool.setuptools]
packages = ["icsguard", "src"]

[tool.setuptools.package-data]
icsguard = ["static/*.html"]
